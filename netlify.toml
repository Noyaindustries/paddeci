# Build à la racine : copie du site depuis PADDE CI/ vers dist/ (publish = dist).
# Ne pas mettre de * dans « Publish directory » sur Netlify : utiliser dist ou laisser vide.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  INFINITE_CORE_API_URL = "https://www.infinitecore.net"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/webhooks/padde-ci"
  to = "/.netlify/functions/save-audit"
  status = 200

[[redirects]]
  from = "/api/webhooks/padde-ci/config-check"
  to = "/.netlify/functions/config-check"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 200
