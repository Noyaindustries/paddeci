# Build à la racine : copie du site depuis PADDE CI/ vers dist/ (publish = dist).
# Ne pas mettre de * dans « Publish directory » sur Netlify : utiliser dist ou laisser vide.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # Chemin sans espace : « PADDE CI/... » cassait souvent le bundle → 502
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Neon : laisser les paquets hors bundle évite des échecs d’exécution silencieux (502).
  external_node_modules = ["@neondatabase/serverless", "@netlify/neon"]
